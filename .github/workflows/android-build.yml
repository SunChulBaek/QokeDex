
name: Qt 6.12 Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04

    env:
      QT_VERSION: "6.12.0"
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API_LEVEL: "37.0"
      ANDROID_BUILD_TOOLS: "37.0.0"

    steps:
      # 1. GitHub 저장소 소스 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 설치
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 3. Android SDK 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # 4. Qt 6.12.0 Android 설치
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          target: android
          arch: android_arm64_v8a
          cache: true

      # 5. 빌드 도구 확인
      - name: Check build environment
        run: |
          echo "Qt root: $QT_ROOT_DIR"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Android NDK: $ANDROID_NDK_ROOT"

          test -x "$QT_ROOT_DIR/bin/qt-cmake"
          test -d "$ANDROID_NDK_ROOT"
          cmake --version
          ninja --version
          java -version

      # 6. CMake 구성
      - name: Configure CMake
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT"

      # 7. APK 빌드
      - name: Build APK
        run: |
          cmake --build build \
            --target apk \
            --parallel 2

      # 8. APK 수집
      - name: Collect APK
        run: |
          mkdir -p artifacts

          find build -type f -name "*.apk" \
            -exec cp {} artifacts/ \;

          echo "Generated APK files:"
          ls -lh artifacts/

          test -n "$(find artifacts -name '*.apk' -print -quit)"

      # 9. APK Artifact 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qt-6.12.0-Android-arm64-v8a
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
